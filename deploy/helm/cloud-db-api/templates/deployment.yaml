apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cloud-db-api.fullname" . }}
  labels:
    {{- include "cloud-db-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "cloud-db-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cloud-db-api.selectorLabels" . | nindent 8 }}
      annotations:
        # Reinicia el pod si cambia la configuración (hash del ConfigMap).
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- if .Values.dockerSocket.enabled }}
      securityContext:
        # El pod se une al grupo `docker` del host para poder escribir en el
        # socket montado sin correr como root. Ver values.dockerSocket.groupId.
        supplementalGroups:
          - {{ .Values.dockerSocket.groupId }}
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: {{ include "cloud-db-api.fullname" . }}
          {{- if .Values.credentials.gcp.secretName }}
          env:
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /home/apiuser/.gcp/credentials.json
          {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.dockerSocket.enabled }}
            - name: docker-sock
              mountPath: /var/run/docker.sock
            {{- end }}
            {{- if .Values.credentials.aws.secretName }}
            # boto3 busca ~/.aws/credentials; el HOME del contenedor es /home/apiuser
            - name: aws-credentials
              mountPath: /home/apiuser/.aws
              readOnly: true
            {{- end }}
            {{- if .Values.credentials.gcp.secretName }}
            - name: gcp-credentials
              mountPath: /home/apiuser/.gcp
              readOnly: true
            {{- end }}
      volumes:
        {{- if .Values.dockerSocket.enabled }}
        - name: docker-sock
          hostPath:
            path: {{ .Values.dockerSocket.hostPath }}
            type: Socket
        {{- end }}
        {{- if .Values.credentials.aws.secretName }}
        - name: aws-credentials
          secret:
            secretName: {{ .Values.credentials.aws.secretName }}
        {{- end }}
        {{- if .Values.credentials.gcp.secretName }}
        - name: gcp-credentials
          secret:
            secretName: {{ .Values.credentials.gcp.secretName }}
        {{- end }}
