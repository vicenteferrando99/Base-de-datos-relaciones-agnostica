[project]
name = "cloud-db-api"
version = "0.1.0"
description = "API REST agnóstica de proveedor para bases de datos relacionales en la nube y entornos locales (TFM)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Vicente Ferrando González" },
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "docker>=7.1.0",
    "pydantic-settings>=2.6.0",
    "boto3>=1.43.24",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "moto>=5.2.2",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# fastapi.Depends y compañía son marker objects: se evalúan a un valor estable
# y son el patrón idiomático de FastAPI como default de parámetros.
# La regla B008 no entiende esto, así que los excluimos explícitamente.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests que requieren Docker corriendo (lentos)",
]
